# ---------------------------------------------------------------------
#  Hercules / SDL Hyperion device statement for the ASYNC TTY line used
#  by ASYPOC.  Companion to bscline.conf.
#
#  NOTE THE dial=no RULE LEARNED FROM THE BSC LINE: Hercules requires
#  BOTH the local and the remote host/port to be specified when
#  dial=no, however backwards that reads.  The same applies here.
# ---------------------------------------------------------------------

attach 0684 2703 lnctl=tele2 dial=no lhost=192.168.1.168 lport=3782 rhost=192.168.1.168 rport=13782 term=tty eol=0D iskip=0A uctrans=yes rto=60000 pto=3000

# ---------------------------------------------------------------------
#  What the operands do
#
#  0684   - device address.  Must match UNIT=684 on the GO.TTYLINE DD
#           card AND must exist in the MVS 3.8J I/O gen as a 2703.
#  lnctl=tele2 - Telegraph Terminal Control Type II, i.e. an ASCII
#           start-stop TTY line.  lnctl=ibm1 is the other async
#           discipline (IBM Terminal Control Type I, the 2741).
#  term=tty    - terminal flavour on the line
#  eol=0D      - the byte that ends an inbound line (ASCII CR)
#  iskip=0A    - inbound bytes to throw away (ASCII LF, so that a
#                telnet client sending CR LF does not give us a
#                spurious empty line)
#  uctrans=yes - fold inbound lower case to upper case
#  rto=60000   - read timeout, 60s.  Generous, because a human is
#                doing the typing.
#
# ---------------------------------------------------------------------
#  VERIFIED WORKING.  The attach above is the one that ran, including
#  term=, eol=, iskip= and uctrans= - all four are accepted by this
#  build.  uctrans=yes does fold inbound lower case to upper, observed.
#
#  ONE THING THE LINE DOES THAT IS NOT OBVIOUS: it carries BIT REVERSED
#  ASCII.  A start-stop line shifts each character out low order bit
#  first, so the byte in storage is the mirror image of the ASCII code.
#  Measured: ASYPOC wrote plain ASCII 'A' X'41' and the terminal saw
#  X'02', which is X'41' reversed and masked to seven bits.  Inbound the
#  same reversal applies and the top bit of the character is an even
#  parity bit, which lands in bit 0 after reversal.
#
#  ASYPOC's translate tables were regenerated to account for this, so
#  nothing in the Hercules config needs changing - but if you write
#  another program for this line, that is the trap.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
#  Connect to it with anything that speaks raw TCP:
#
#      telnet 192.168.1.168 3782
#      python tools/ttypartner.py --connect 192.168.1.168:3782
#
#  The partner tool is worth using at least once because it shows the
#  raw bytes in both directions, which telnet will not.
#
#  Verify from the Hercules console:
#       devlist                 - the 0684 line should be listed
#       qd 0684                 - query device 0684
#  Verify from the MVS console:
#       D U,,,684,1             - device 684 must be known and online
#       V 684,ONLINE            - vary it online if it is offline
# ---------------------------------------------------------------------
