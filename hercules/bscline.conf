# ---------------------------------------------------------------------
#  Hercules / SDL Hyperion device statement for the BSC line.
#
#  THE LINE BELOW IS KNOWN GOOD - it is the attach command that actually
#  worked, recorded verbatim.  Put it in hercules.cnf as a device
#  statement (drop the leading "attach"), or paste it at the Hercules
#  console as-is.
# ---------------------------------------------------------------------

attach 0090 2703 lnctl=bsc dial=no lhost=192.168.1.168 lport=3781 rhost=192.168.1.168 rport=13781 rto=30000 pto=3000

# ---------------------------------------------------------------------
#  What the operands do
#
#  0090   - device address.  Must match UNIT=090 on the GO.BSCLINE DD
#           card AND must exist in the MVS 3.8J I/O gen as a 2703.
#  2703   - IBM 2703 Transmission Control
#  lnctl=bsc  - run the adapter as a Binary Synchronous line.  This is
#               the operand whose availability varies between Hyperion
#               builds; it is present and working here.
#  dial=no    - non switched (leased) point to point line
#  lhost/lport - the local side Hercules binds and listens on
#  rhost/rport - the remote side.  Hercules REQUIRES both the local and
#                the remote host/port to be specified when dial=no.
#                Counterintuitive, since dial=no reads as "there is no
#                remote endpoint to name", but that is the rule - omit
#                either pair and the attach will not work.
#  rto/pto     - read and poll timeouts in milliseconds.  No eto= was
#                needed.
#
#  bscpartner.py connects IN to lport:
#       python tools/bscpartner.py --connect 192.168.1.168:3781
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
#  Earlier attempts, kept only as a record of what was tried.  Neither
#  of these is the configuration that worked.
# ---------------------------------------------------------------------
#
# 0091 2703 lnctl=bsc dial=no lport=3781 rto=30000 pto=3000 eto=0
# 0090 2703 lnctl=bsc dial=IN lhost=192.168.1.168 lport=3781 rto=30000 pto=3000 eto=30000
# 0090 2703 lnctl=BSC dial=IN rhost=192.168.1.168 lport=3781 rport=13781 rto=30000 pto=3000

# ---------------------------------------------------------------------
#  Verify from the Hercules console:
#       devlist                 - the 0090 line should be listed
#       qd 0090                 - query device 0090
#  Verify from the MVS console:
#       D U,,,090,1             - device 090 must be known and online
#       V 090,ONLINE            - vary it online if it is offline
# ---------------------------------------------------------------------
